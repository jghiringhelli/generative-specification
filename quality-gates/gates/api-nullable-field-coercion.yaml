id: api-nullable-field-coercion
name: Nullable field coercion on empty strings
description: >
  Optional profile fields (bio, image) must be stored and returned as null when the client
  sends an empty string. Storing "" produces a type inconsistency: the API spec declares the
  field nullable, but an empty string is truthy and semantically different from "not set".
  This gate is derived from Hurl RC1: the Conduit contract test for PUT /api/user sent
  bio="" and asserted the response contained null — the implementation returned "" and the
  test failed. Apply the coercion at the service layer: bio === '' ? null : bio.
property: Verifiable
tags: [api, rest, node, typescript, javascript, database]
phase: development
trigger: commit
blocking: true
check:
  type: script
  command: "hurl --test --variable host=http://localhost:3000 specs/api/hurl/update-user.hurl"
