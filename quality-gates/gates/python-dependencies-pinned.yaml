id: python-dependencies-pinned
tier: core
tag: ENVIRONMENT
title: Python Dependencies Pinned
description: |
  Python projects must have a locked dependency file with pinned versions.
  requirements.txt without pins, or pyproject.toml without a lockfile,
  resolves to whatever is current at install time ΓÇö producing environment
  drift across machines, containers, and AI sessions.
check:
  type: script
  language: shell
  script: |
    if [ -f "requirements.txt" ]; then
      if grep -E "^[a-zA-Z].*[^=><~!]$" requirements.txt | grep -v "^#" | grep -v "^$" > /dev/null 2>&1; then
        echo "FAIL: requirements.txt contains unpinned dependencies."
        exit 1
      fi
    elif [ -f "pyproject.toml" ]; then
      if [ ! -f "poetry.lock" ] && [ ! -f "uv.lock" ] && [ ! -f "pdm.lock" ]; then
        echo "FAIL: pyproject.toml exists but no lockfile found (poetry.lock, uv.lock, pdm.lock)."
        exit 1
      fi
    else
      echo "FAIL: No Python dependency file found."
      exit 1
    fi
    echo "PASS"
fix: |
  Pin all versions in requirements.txt (use pip-compile or pip freeze > requirements.txt).
  Or use poetry/uv/pdm and commit the lockfile.
