name: Propose a change
description: A new definition, gate, example or correction
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Large changes or changes to a definition: please open a Discussion first and link it here.
  - type: textarea
    id: change
    attributes:
      label: What do you propose?
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: The question. How does this make it easier to check, with a check that runs, that derived code is correct?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: The check or evidence that supports it
      description: A test, an example that fails and one that passes, or a source. Say if it is measured, a pilot, an anecdote or a hypothesis.
    validations:
      required: true
