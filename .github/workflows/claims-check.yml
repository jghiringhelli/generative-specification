name: Claims check

on:
  pull_request:
    paths:
      - '**.md'

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flag forbidden words in added lines
        run: |
          set -e
          git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- '*.md' \
            | grep -E '^\+[^+]' \
            | grep -iE '\b(proven|certified|officially|ISO standard)\b' \
            | grep -v 'claims-ok' > flagged.txt || true
          if [ -s flagged.txt ]; then
            echo "These added lines use words the claims rule forbids (see CONTRIBUTING.md)."
            echo "If a use is correct in context, add <!-- claims-ok: reason --> on the line and explain in the PR."
            cat flagged.txt
            exit 1
          fi
