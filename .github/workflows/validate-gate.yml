name: Validate Quality Gates

on:
  pull_request:
    paths:
      - 'quality-gates/gates/**'
      - 'quality-gates/schema.yaml'

jobs:
  validate:
    name: Gate Validation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate gate files
        id: validate
        run: |
          node .github/scripts/validate-gates.js 2>&1 | tee /tmp/validation-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Read validation output
        id: output
        run: |
          OUTPUT=$(head -30 /tmp/validation-output.txt)
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Remove stale validation labels
        uses: actions/github-script@v7
        with:
          script: |
            const staleLabels = ['gate:approved', 'gate:needs-revision', 'gate:schema-error', 'gate:new', 'gate:supersedes'];
            const existing = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            for (const label of existing.data) {
              if (staleLabels.includes(label.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  name: label.name
                });
              }
            }

      - name: Label PR — schema error
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['gate:schema-error']
            });

      - name: Label PR — new / supersedes
        if: steps.validate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const yaml = require('js-yaml');

            const changed = execSync(
              'git diff --name-only origin/${{ github.base_ref }}...HEAD -- quality-gates/gates/'
            ).toString().trim().split('\n').filter(Boolean);

            let hasSupersedes = false;
            for (const f of changed) {
              try {
                const gate = yaml.load(fs.readFileSync(f, 'utf8'));
                if (gate && gate.supersedes) hasSupersedes = true;
              } catch {}
            }

            const labels = ['gate:new'];
            if (hasSupersedes) labels.push('gate:supersedes');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels
            });

      - name: Post validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.validate.outcome }}';
            const output = `${{ steps.output.outputs.result }}`;
            const icon = outcome === 'success' ? '✅' : '❌';
            const statusLine = outcome === 'success'
              ? 'All gate files are valid. Ready for maintainer review.'
              : 'Fix the errors above and push again. See [schema.yaml](quality-gates/schema.yaml) for field definitions.';
            const body = `## ${icon} Gate Validation\n\n\`\`\`\n${output}\n\`\`\`\n\n${statusLine}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
