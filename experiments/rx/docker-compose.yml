services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rx_user
      POSTGRES_PASSWORD: rx_password
      POSTGRES_DB: rx_conduit
    ports:
      - "5447:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rx_user -d rx_conduit"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
