name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Prisma Generate & Migrate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/conduit_test
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Jest Test & Coverage Gate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/conduit_test
          JWT_SECRET: supersecretjwtkeyforci
        run: npm run test:coverage

      - name: Stryker Mutation Gate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/conduit_test
          JWT_SECRET: supersecretjwtkeyforci
        run: npm run test:mutation
