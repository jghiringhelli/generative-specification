name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, Audit, and Mutation Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conduit_user
          POSTGRES_PASSWORD: conduit_password
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Prisma Generate and Migrate
        env:
          DATABASE_URL: postgresql://conduit_user:conduit_password@localhost:5432/conduit_test?schema=public
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run unit & integration tests with coverage
        env:
          DATABASE_URL: postgresql://conduit_user:conduit_password@localhost:5432/conduit_test?schema=public
          JWT_SECRET: ci_test_secret_key_at_least_32_characters_long
        run: npm run test:coverage

      - name: Stryker Mutation Testing Gate
        env:
          DATABASE_URL: postgresql://conduit_user:conduit_password@localhost:5432/conduit_test?schema=public
          JWT_SECRET: ci_test_secret_key_at_least_32_characters_long
        run: npm run test:mutation
