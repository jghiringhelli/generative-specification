name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint

      - name: Prisma Generate & Migrate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/conduit_test
        run: |
          npx prisma generate
          npx prisma migrate deploy || npx prisma db push

      - name: Jest Unit & Integration Tests with Coverage Gate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/conduit_test
          JWT_SECRET: ci-test-secret-key-12345
          JWT_EXPIRY: 7d
        run: npm run test:coverage

      - name: Stryker Mutation Gate Step
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/conduit_test
          JWT_SECRET: ci-test-secret-key-12345
        run: npm run test:mutation
