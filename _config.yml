remote_theme: just-the-docs/just-the-docs@v0.10.0

title: Generative Specification
description: "Community home for the Generative Specification methodology - the first programming discipline of the pragmatic dimension, designed for a stateless reader."
url: https://genspec.dev

search_enabled: true
heading_anchors: true
color_scheme: sala-de-control

aux_links:
  "White Paper (Zenodo)": "https://doi.org/10.5281/zenodo.21726017"
  "ForgeCraft on GitHub": "https://github.com/jghiringhelli/forgecraft-mcp"

aux_links_new_tab: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "&copy; 2026 J.C. Ghiringhelli. Distributed under <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a>. Citation: <a href=\"https://doi.org/10.5281/zenodo.21726017\">Zenodo</a>"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Research artifacts under experiments/ (agent-built sample projects, prompts, outputs)
# are rendered by GitHub Pages (jekyll-optional-front-matter) and keep their URLs,
# but must not appear in the sidebar nav or in the search index.
defaults:
  - scope:
      path: "experiments"
    values:
      nav_exclude: true
      search_exclude: true
